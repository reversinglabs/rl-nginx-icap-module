load_module modules/ngx_http_detect_icap_module.so;

worker_processes 100;

# Docker's default RLIMIT_NOFILE *soft* limit is 1024, well below the 4096
# worker_connections below -- without this, nginx warns and silently caps
# concurrency per worker at ~1024. Raises each worker's soft limit up to
# the container's hard limit before forking (Docker's default hard limit
# is far above 65535, so no matching `--ulimit`/compose `ulimits:` needed).
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log info;
pid        /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    access_log /var/log/nginx/access.log;

    client_max_body_size      1000M;
    client_body_buffer_size   1000M;
    send_timeout              1d;      # nginx→client: large buffered RESPMOD responses

    # Docker's embedded DNS server — lets nginx re-resolve "backend" as the
    # BACKEND_REPLICAS container count changes, instead of caching one IP
    # for the lifetime of the worker process.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # "zone" + "resolve" make this upstream re-resolve "backend" on the
    # resolver's TTL and load-balance across every IP currently returned
    # for it — i.e. every scaled backend replica.
    upstream backend_pool {
        zone backend_pool 64k;
        server backend:8000 resolve;
    }

    server {
        listen       8080;
        listen       8443 ssl;
        server_name  localhost;

        # Written into the nginx_certs volume by the "certificates" compose
        # service (see docker-compose.yml).
        ssl_certificate     /etc/nginx/ssl/nginx-rproxy.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx-rproxy.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location ^~ / {
            detect_icap_log          /var/log/nginx/icap.log info;
            detect_icap_pass         "${ICAP_SCHEME}://${ICAP_HOSTNAME}:${ICAP_PORT}/${ICAP_SERVICE}";
            detect_icap_methods      POST PUT;
            detect_icap_resp_mode    on;
            # detect_icap_auth       "${ICAP_AUTH}";
            # ICAP_SSL_TRUSTED_CERT/ICAP_SSL_NAME are empty in every env file
            # except the TLS ones (both directives are no-ops when empty) —
            # set them per-lab in the env file instead of editing this file.
            detect_icap_ssl_trusted_certificate "${ICAP_SSL_TRUSTED_CERT}";
            detect_icap_ssl_name                "${ICAP_SSL_NAME}";
            detect_icap_read_timeout 3m;
            detect_icap_retry_max    3;

            proxy_pass               http://backend_pool;
            proxy_set_header         Host $host;
            proxy_read_timeout       30m;    # backend may serve large files from NAS
            proxy_send_timeout       30m;
            proxy_buffers            512 256k;
            proxy_buffer_size        256k;
            proxy_max_temp_file_size 2048m;
        }
    }

    # Separate server/port (not the published NGINX_PORT) so basic connection
    # and request counters are reachable by nginx-prometheus-exporter on the
    # docker network without exposing them on the public traffic path.
    server {
        listen       8081;
        server_name  localhost;

        location = /stub_status {
            stub_status;
        }
    }
}
